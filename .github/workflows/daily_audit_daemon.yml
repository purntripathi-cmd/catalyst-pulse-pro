name: Catalyst Daily Outcome Auditor

on:
  schedule:
    # 2:55 PM IST Mon-Fri (09:25 UTC)
    - cron: '25 09 * * 1-5'
  
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Trigger Source'
        required: false
        default: 'External_Cron'

jobs:
  audit-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pandas yfinance requests feedparser

      - name: Run Audit Daemon
        run: python audit_daemon.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalyst_prediction_ledger.csv
          git diff --staged --quiet || (git commit -m "Auto-audit: Update prediction outcomes (IST) [skip ci]" && git pull --rebase origin main && git push origin HEAD:main)
