name: Catalyst Daily Outcome Auditor

on:
  schedule:
    # 4:00 PM IST Mon-Fri (10:30 UTC)
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  audit-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pandas yfinance requests feedparser

      - name: Run Audit Daemon
        run: python audit_daemon.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalyst_prediction_ledger.csv
          git diff --staged --quiet || (git commit -m "Auto-audit: Update prediction outcomes (IST) [skip ci]" && git push origin HEAD:main)
